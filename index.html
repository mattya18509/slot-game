<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スロットゲーム 🎰</title>

<style>
body {
    background: black;
    color: white;
    text-align: center;
    font-family: sans-serif;
    margin: 0;
    padding-top: 50px;
}

h1 {
    font-size: 40px;
}

.slot {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 30px 0;
}

.number {
    width: 100px;
    height: 120px;
    background: white;
    color: black;
    border-radius: 15px;
    font-size: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

button {
    font-size: 30px;
    padding: 15px 40px;
    border-radius: 15px;
    cursor: pointer;
}

#result {
    font-size: 30px;
    margin-top: 30px;
}
</style>
</head>

<body>

<h1>🎰 SLOT GAME 🎰</h1>

<div class="slot">
    <div class="number" id="slot1">7</div>
    <div class="number" id="slot2">7</div>
    <div class="number" id="slot3">7</div>
</div>

<button id="stopButton">STOP</button>

<div id="result">1回目：左を止めます</div>

<script>

const slots = [
    document.getElementById("slot1"),
    document.getElementById("slot2"),
    document.getElementById("slot3")
];

const button = document.getElementById("stopButton");
const result = document.getElementById("result");

let numbers = [7, 7, 7];
let stopped = [false, false, false];
let timer = null;


// ============================
// 音を作る
// ============================

let audioContext = null;

function initAudio() {

    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }
}


// 1つの音を鳴らす
function beep(frequency, duration, volume = 0.15) {

    initAudio();

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.frequency.value = frequency;
    oscillator.type = "square";

    gain.gain.setValueAtTime(volume, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + duration);
}


// スロット開始音「ピピピッ」
function startSound() {

    beep(600, 0.08);

    setTimeout(() => {
        beep(800, 0.08);
    }, 100);

    setTimeout(() => {
        beep(1000, 0.12);
    }, 200);
}


// 停止音「カチッ」
function stopSound() {

    beep(180, 0.12, 0.2);

}


// 普通の当たり「ジャーン」
function winSound() {

    beep(600, 0.15);

    setTimeout(() => {
        beep(800, 0.15);
    }, 150);

    setTimeout(() => {
        beep(1000, 0.3);
    }, 300);

}


// 777専用「ジャジャジャーン！」
function jackpotSound() {

    beep(700, 0.12);

    setTimeout(() => {
        beep(900, 0.12);
    }, 130);

    setTimeout(() => {
        beep(1100, 0.12);
    }, 260);

    setTimeout(() => {
        beep(1400, 0.5, 0.2);
    }, 390);

}


// ============================
// スロットを動かす
// ============================

function startSlots() {

    stopped = [false, false, false];

    result.textContent = "1回目：左を止めます";

    startSound();

    timer = setInterval(() => {

        for (let i = 0; i < 3; i++) {

            if (!stopped[i]) {

                numbers[i] =
                    Math.floor(Math.random() * 9) + 1;

                slots[i].textContent = numbers[i];

            }

        }

    }, 100);
}


// ============================
// 結果を判定
// ============================

function checkResult() {

    // 777
    if (
        numbers[0] === 7 &&
        numbers[1] === 7 &&
        numbers[2] === 7
    ) {

        result.textContent =
            "🎉🎉🎉 777 大当たり！！ 🎉🎉🎉";

        jackpotSound();

    }

    // その他の3つ揃い
    else if (
        numbers[0] === numbers[1] &&
        numbers[1] === numbers[2]
    ) {

        result.textContent =
            "🎊 当たり！ 🎊";

        winSound();

    }

    // はずれ
    else {

        result.textContent =
            "はずれ...";

    }

}


// ============================
// STOPボタン
// ============================

button.addEventListener("click", () => {

    // 音を使えるようにする
    initAudio();


    // 1回目 → 左
    if (!stopped[0]) {

        stopped[0] = true;

        stopSound();

        result.textContent =
            "2回目：真ん中を止めます";

        return;
    }


    // 2回目 → 真ん中
    if (!stopped[1]) {

        stopped[1] = true;

        stopSound();

        result.textContent =
            "3回目：右を止めます";

        return;
    }


    // 3回目 → 右
    if (!stopped[2]) {

        stopped[2] = true;

        stopSound();

        clearInterval(timer);

        timer = null;

        checkResult();

        button.textContent = "もう一度";

        return;
    }


    // 4回目 → 再スタート
    button.textContent = "STOP";

    startSlots();

});


// 最初からスタート
startSlots();

</script>

</body>
</html>
