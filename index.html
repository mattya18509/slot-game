<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>スロットゲーム 🎰</title>

<style>
body {
    background: black;
    color: white;
    text-align: center;
    font-family: sans-serif;
    margin: 0;
    padding-top: 50px;
}

h1 {
    font-size: 40px;
}

.slot {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 30px 0;
}

.number {
    width: 100px;
    height: 120px;
    background: white;
    color: black;
    border-radius: 15px;
    font-size: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

/* 7だけ赤色 */
.seven {
    color: red;
    font-weight: 900;
}

button {
    font-size: 30px;
    padding: 15px 40px;
    border-radius: 15px;
    cursor: pointer;
}

#result {
    font-size: 30px;
    margin-top: 30px;
}
</style>
</head>

<body>

<h1>🎰 SLOT GAME 🎰</h1>

<div class="slot">
    <div class="number" id="slot1">🍒</div>
    <div class="number" id="slot2">👾</div>
    <div class="number" id="slot3">🎞️</div>
</div>

<button id="stopButton">STOP</button>

<div id="result">1回目：左を止めます</div>

<script>

// スロットの絵柄
const symbols = {
    1: "🍒",
    2: "👾",
    3: "🎞️",
    4: "🔔",
    5: "🍉",
    6: "💲",
    7: "7",
    8: "🍊",
    9: "💎"
};

const slots = [
    document.getElementById("slot1"),
    document.getElementById("slot2"),
    document.getElementById("slot3")
];

const button = document.getElementById("stopButton");
const result = document.getElementById("result");

let numbers = [1, 2, 3];
let stopped = [false, false, false];
let timer = null;


// ======================
// 音の設定
// ======================

let audioContext = null;

function initAudio() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }
}


// ピッという音
function beep(frequency, duration, volume = 0.15) {

    if (!audioContext) return;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.frequency.value = frequency;
    oscillator.type = "square";

    gain.gain.value = volume;

    oscillator.start();

    setTimeout(() => {
        oscillator.stop();
    }, duration);
}


// スロット開始音
function startSound() {

    beep(600, 100);

    setTimeout(() => {
        beep(800, 100);
    }, 120);

    setTimeout(() => {
        beep(1000, 150);
    }, 240);
}


// スロット停止音
function stopSound() {
    beep(180, 120, 0.2);
}


// 普通の当たり
function winSound() {

    beep(600, 150);

    setTimeout(() => {
        beep(800, 150);
    }, 160);

    setTimeout(() => {
        beep(1000, 250);
    }, 320);
}


// 777大当たり
function jackpotSound() {

    beep(700, 150);

    setTimeout(() => {
        beep(900, 150);
    }, 160);

    setTimeout(() => {
        beep(1100, 150);
    }, 320);

    setTimeout(() => {
        beep(1400, 400);
    }, 480);
}


// ======================
// 絵柄を表示
// ======================

function showSymbol(slot, number) {

    slot.textContent = symbols[number];

    // 7なら赤色にする
    if (number === 7) {
        slot.classList.add("seven");
    } else {
        slot.classList.remove("seven");
    }
}


// ======================
// スロット開始
// ======================

function startSlots() {

    stopped = [false, false, false];

    result.textContent = "1回目：左を止めます";

    startSound();

    timer = setInterval(() => {

        for (let i = 0; i < 3; i++) {

            if (!stopped[i]) {

                numbers[i] = Math.floor(Math.random() * 9) + 1;

                showSymbol(slots[i], numbers[i]);
            }
        }

    }, 100);
}


// ======================
// 結果判定
// ======================

function checkResult() {

    // 777
    if (
        numbers[0] === 7 &&
        numbers[1] === 7 &&
        numbers[2] === 7
    ) {

        result.textContent =
            "🎉🎉🎉 777 大当たり！！ 🎉🎉🎉";

        jackpotSound();

    }

    // 3つ同じ
    else if (
        numbers[0] === numbers[1] &&
        numbers[1] === numbers[2]
    ) {

        result.textContent =
            "🎊 当たり！ 🎊";

        winSound();

    }

    // はずれ
    else {

        result.textContent =
            "はずれ...";

    }
}


// ======================
// STOPボタン
// ======================

button.addEventListener("click", () => {

    // 音を使えるようにする
    initAudio();


    // 左を止める
    if (!stopped[0]) {

        stopped[0] = true;

        stopSound();

        result.textContent =
            "2回目：真ん中を止めます";

        return;
    }


    // 真ん中を止める
    if (!stopped[1]) {

        stopped[1] = true;

        stopSound();

        result.textContent =
            "3回目：右を止めます";

        return;
    }


    // 右を止める
    if (!stopped[2]) {

        stopped[2] = true;

        stopSound();

        clearInterval(timer);

        timer = null;

        checkResult();

        button.textContent = "もう一度";

        return;
    }


    // もう一度回す
    button.textContent = "STOP";

    startSlots();

});


// 最初からスロットを回す
startSlots();

</script>

</body>
</html>
