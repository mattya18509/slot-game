<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スロットゲーム 🎰</title>

<style>
body {
    background: black;
    color: white;
    text-align: center;
    font-family: sans-serif;
    margin: 0;
    padding-top: 50px;
}

h1 {
    font-size: 40px;
}

.slot {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 30px 0;
}

.number {
    width: 100px;
    height: 120px;
    background: white;
    color: black;
    border-radius: 15px;
    font-size: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

button {
    font-size: 30px;
    padding: 15px 40px;
    border-radius: 15px;
    cursor: pointer;
}

#result {
    font-size: 30px;
    margin-top: 30px;
}
</style>
</head>

<body>

<h1>🎰 SLOT GAME 🎰</h1>

<div class="slot">
    <div class="number" id="slot1">7</div>
    <div class="number" id="slot2">7</div>
    <div class="number" id="slot3">7</div>
</div>

<button id="stopButton">STOP</button>

<div id="result">1回目：左を止めます</div>

<script>

const slots = [
    document.getElementById("slot1"),
    document.getElementById("slot2"),
    document.getElementById("slot3")
];

const button = document.getElementById("stopButton");
const result = document.getElementById("result");

let numbers = [7, 7, 7];

let stopped = [false, false, false];

let timer = null;


// スロットを動かす
function startSlots() {

    stopped = [false, false, false];

    result.textContent = "1回目：左を止めます";

    timer = setInterval(() => {

        for (let i = 0; i < 3; i++) {

            if (!stopped[i]) {

                numbers[i] = Math.floor(Math.random() * 9) + 1;

                slots[i].textContent = numbers[i];

            }

        }

    }, 100);

}


// 結果を判定
function checkResult() {

    if (numbers[0] === 7 &&
        numbers[1] === 7 &&
        numbers[2] === 7) {

        result.textContent = "🎉🎉🎉 777 大当たり！！ 🎉🎉🎉";

    }
    else if (numbers[0] === numbers[1] &&
             numbers[1] === numbers[2]) {

        result.textContent = "🎊 当たり！ 🎊";

    }
    else {

        result.textContent = "はずれ...";

    }

}


// STOPボタン
button.addEventListener("click", () => {

    // まだ動いていない場合
    if (timer === null) {
        startSlots();
        return;
    }


    // 1回目 → 左
    if (!stopped[0]) {

        stopped[0] = true;

        result.textContent = "2回目：真ん中を止めます";

        return;
    }


    // 2回目 → 真ん中
    if (!stopped[1]) {

        stopped[1] = true;

        result.textContent = "3回目：右を止めます";

        return;
    }


    // 3回目 → 右
    if (!stopped[2]) {

        stopped[2] = true;

        clearInterval(timer);
        timer = null;

        checkResult();

        button.textContent = "もう一度";

        return;
    }


    // 4回目 → 最初から
    button.textContent = "STOP";

    startSlots();

});


// 最初からスタート
startSlots();

</script>

</body>
</html>
